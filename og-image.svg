<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06090F" />
      <stop offset="100%" stop-color="#0D131F" />
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="50%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#FB923C" />
    </linearGradient>
    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
    <filter id="glow-orange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="80" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="300" cy="150" r="220" fill="#2563EB" opacity="0.18" filter="url(#glow-blue)" />
  <circle cx="950" cy="450" r="260" fill="#EA580C" opacity="0.15" filter="url(#glow-orange)" />

  <!-- Grid pattern overlay -->
  <g opacity="0.05" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="150" y1="0" x2="150" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="450" y1="0" x2="450" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="750" y1="0" x2="750" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1050" y1="0" x2="1050" y2="630" />
  </g>

  <!-- Top Pill / Badge -->
  <g transform="translate(100, 90)">
    <rect width="450" height="42" rx="21" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
    <circle cx="28" cy="21" r="5" fill="#10B981" />
    <text x="46" y="26" fill="#60A5FA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" letter-spacing="0.5">GOOGLE ANTIGRAVITY IDE • QUALITY KIT</text>
  </g>

  <!-- Title -->
  <text x="100" y="220" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5">
    Surgical Code Quality.
  </text>
  <text x="100" y="295" fill="url(#text-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5">
    Zero Conversational Slop.
  </text>

  <!-- Subtitle -->
  <text x="100" y="360" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400">
    The deterministic engineering framework that enforces minimal diffs &amp; verified execution.
  </text>

  <!-- Metrics Cards Row -->
  <g transform="translate(100, 430)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="220" height="110" rx="16" fill="#121A2B" stroke="#1E293B" stroke-width="1.5" />
    <text x="24" y="52" fill="#60A5FA" font-family="'JetBrains Mono', monospace" font-size="36" font-weight="700">0%</text>
    <text x="24" y="85" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">Conversational Slop</text>

    <!-- Card 2 -->
    <rect x="250" y="0" width="220" height="110" rx="16" fill="#121A2B" stroke="#1E293B" stroke-width="1.5" />
    <text x="274" y="52" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="36" font-weight="700">100%</text>
    <text x="274" y="85" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">Verified Checks</text>

    <!-- Card 3 -->
    <rect x="500" y="0" width="220" height="110" rx="16" fill="#121A2B" stroke="#1E293B" stroke-width="1.5" />
    <text x="524" y="52" fill="#FB923C" font-family="'JetBrains Mono', monospace" font-size="36" font-weight="700">9 Core</text>
    <text x="524" y="85" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">Quality Pillars</text>

    <!-- Card 4 -->
    <rect x="750" y="0" width="250" height="110" rx="16" fill="#121A2B" stroke="#1E293B" stroke-width="1.5" />
    <text x="774" y="52" fill="#C084FC" font-family="'JetBrains Mono', monospace" font-size="36" font-weight="700">WCAG AAA</text>
    <text x="774" y="85" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">Accessibility Standard</text>
  </g>
</svg>
